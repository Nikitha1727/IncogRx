# Privacy rules. main.py reads simple "key: value" lines.
age_band_years: 10             # ages become bands like 40-49 (the band always contains the true age)
age_top_code: 80               # ages >= 80 become "80+" (very old patients are rare)
date_shift_max_days: 180       # every date of one patient moves by the same secret offset (intervals kept)
keep_tehsil: false             # false: only the district survives (villages and tehsils become the district)
dob: suppress                  # suppress | year   (a birth year pins the age and defeats the age band)
rare_condition_max_patients: 3 # diagnoses held by <= N patients are generalised to their ICD-10 chapter
min_group_size: 5              # k used when reporting residual risk
